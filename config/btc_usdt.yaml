# Two-Step Trader's Landing — BTC/USDT perpetual on Binance USDⓈ-M futures.
# Shorts require a derivatives market; for spot set market_type: spot,
# symbol: BTC/USDT, exchange.id: binance and risk.allow_shorts: false.
# Any value can be overridden with env vars, e.g. TSF__RISK__RISK_PER_TRADE=0.005

exchange:
  id: binanceusdm
  symbol: BTC/USDT:USDT
  market_type: future
  api_key_env: BINANCE_API_KEY        # name of env var, never the key itself
  api_secret_env: BINANCE_API_SECRET
  sandbox: false
  enable_rate_limit: true
  request_timeout_ms: 30000
  max_retries: 5
  retry_backoff_seconds: 2.0
  # Offline fallbacks (overridden by live market metadata when available)
  amount_step: 0.001
  price_tick: 0.1
  min_amount: 0.001
  min_notional: 100.0

data:
  trend_timeframe: 15m
  entry_timeframe: 5m
  source: ccxt               # ccxt | csv | synthetic
  start: "2024-06-01"
  end: "2024-12-01"
  cache_dir: cache
  derive_trend_from_entry: true
  fetch_limit: 1000
  min_history_bars: 200
  outlier_return_threshold: 0.15
  max_gap_ratio: 0.02

strategy:
  atr_period: 14
  atr_multiplier: 2.0
  band_source: close
  trend_lookback: 20
  swing_left: 2
  swing_right: 2
  min_swings: 2
  require_structure_intact: true
  zone_sources: [swing, atr_band]
  zone_tolerance_atr: 0.1
  min_wick_to_range: 0.5
  min_wick_to_body: 1.5
  max_signal_bar_range_atr: 3.0
  min_volume: 0.0
  stop_atr_multiplier: 2.0
  reward_risk: 2.0
  pullback_max_m5_bars: 288

risk:
  risk_per_trade: 0.01
  max_positions_per_symbol: 1
  max_total_positions: 1
  max_leverage: 3.0
  daily_loss_limit: 0.03
  allow_shorts: true

execution:
  taker_fee: 0.0004
  slippage: 0.0005
  assumed_spread: 0.0001
  max_spread: 0.001
  max_slippage: 0.002
  dry_run: true
  poll_interval_seconds: 10

backtest:
  initial_equity: 10000
  output_dir: reports
  trade_db: reports/trades.sqlite
  periods_per_year: 365
  risk_free_rate: 0.0

logging:
  level: INFO
  file: logs/framework.log
